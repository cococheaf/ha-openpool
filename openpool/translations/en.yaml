configuration:
  log_level:
    name: Log level
    description: Controls how much detail OpenPool writes to the add-on log.
  poll_interval_s:
    name: Update interval
    description: Time in seconds between Home Assistant value updates.
  connection:
    name: Home Assistant connection
    description: Connection to your Home Assistant instance. The automatic Supervisor connection is normally enough.
    fields:
      auth_mode:
        name: Authentication
        description: Use the automatic add-on connection or enter your own Home Assistant access.
      homeassistant_url:
        name: Home Assistant URL
        description: Internal address of your Home Assistant instance.
      access_token:
        name: Access token
        description: Only needed when the automatic add-on connection is not used.
  features:
    name: Features
    description: Turn optional OpenPool control areas on or off.
    fields:
      heat_pump_control:
        name: Heat pump control
        description: Allows OpenPool to control and monitor the heat pump, including PV release and pump run-on.
      weather_control:
        name: Weather control
        description: Uses the daily forecast for a recommendation or automatic pump profile selection.
  devices:
    name: Controlled devices
    description: Devices OpenPool may switch or read directly.
    fields:
      pump_and_chlorinator_switch:
        name: Pump and chlorinator switch
        description: Home Assistant switch that powers the pump and chlorination system.
      heat_pump:
        name: Heat pump
        description: Climate device of your pool heat pump.
      heat_pump_operating_mode:
        name: Heat pump operating mode
        description: Home Assistant selection list used by OpenPool to set the heat pump start mode.
      weather_service:
        name: Weather service
        description: Weather entity from which OpenPool reads the daily forecast.
  energy:
    name: Grid, PV and battery
    description: Sensors OpenPool uses to calculate PV surplus, grid import, grid export and optional battery charging.
    fields:
      one_grid_sensor_for_import_and_export:
        name: One shared grid sensor for import and export
        description: Turn this on when one sensor reports grid import and export together as positive or negative values.
      positive_grid_value_is_import:
        name: Positive value of the shared grid sensor means import
        description: On means a positive value is grid import. Off means a positive value is grid export. Only relevant when a shared grid sensor is used.
      shared_grid_power_sensor:
        name: Shared grid sensor
        description: Sensor for import and export in one value. Only relevant when a shared grid sensor is used.
      pv_production_sensor:
        name: PV production
        description: Sensor for the current PV production power.
      grid_export_sensor:
        name: Grid export
        description: Sensor for the current export to the grid. Used only with two separate grid sensors.
      grid_import_sensor:
        name: Grid import
        description: Sensor for the current import from the grid. Used only with two separate grid sensors.
      one_battery_sensor_for_charge_and_discharge:
        name: One shared battery sensor for charge and discharge
        description: Turn this on when one sensor reports battery charge and discharge together as positive or negative values.
      positive_battery_value_is_charge:
        name: Positive value of the shared battery sensor means charging
        description: On means a positive value is battery charging. Off means a positive value is battery discharging. Only relevant when a shared battery sensor is used.
      shared_battery_power_sensor:
        name: Shared battery sensor
        description: Sensor for battery charge and discharge in one value. Only relevant when a shared battery sensor is used.
      battery_charge_sensor:
        name: Battery charge
        description: Sensor for current battery charging power. Used only with two separate battery sensors.
      battery_discharge_sensor:
        name: Battery discharge
        description: Sensor for current battery discharging power. Used only with two separate battery sensors.
      battery_soc_sensor:
        name: Battery state of charge (SOC)
        description: Optional sensor for the battery charge level in percent.
      battery_discharge_threshold_w:
        name: Battery-priority discharge threshold
        description: Battery discharge up to this value in watts is tolerated as a short load spike. Above it, OpenPool stops the heat pump immediately when prefer battery charging is enabled.
      prefer_battery_charging:
        name: Prefer battery charging
        description: OpenPool releases the heat pump only when enough PV surplus remains after house consumption and battery charging.
  pump_readings:
    name: Pump readings
    description: Sensors for display and for detecting pump/chlorination state.
    fields:
      pump_power_sensor:
        name: Pump power
      pump_current_sensor:
        name: Pump current
      pump_voltage_sensor:
        name: Pump voltage
      pump_signal_sensor:
        name: Pump signal
  heat_pump_readings:
    name: Heat pump readings
    description: Sensors for display, PV calculation and heat pump state.
    fields:
      heat_pump_power_sensor:
        name: Heat pump power
      heat_pump_current_sensor:
        name: Heat pump current
      heat_pump_voltage_sensor:
        name: Heat pump voltage
      heat_pump_fan_sensor:
        name: Heat pump fan speed
      heat_pump_ambient_air_sensor:
        name: Ambient air at the heat pump
      heat_pump_water_in_sensor:
        name: Water temperature inlet
      heat_pump_water_out_sensor:
        name: Water temperature outlet
  thresholds:
    name: Thresholds
    description: Values that decide when OpenPool may start or stop the heat pump.
    fields:
      pv_start_export_w:
        name: Start heat pump above
        description: Available PV power in watts required before the heat pump may start.
      pv_stop_export_w:
        name: Stop heat pump below
        description: If available PV power drops below this value, OpenPool stops the heat pump after the stability time.
      pv_start_stable_minutes:
        name: PV power stable before start
        description: Minutes with enough PV power before OpenPool may start the heat pump.
      pv_stop_stable_minutes:
        name: PV power too low before stop
        description: Minutes with too little PV power before OpenPool stops the heat pump.
      heater_temp_min:
        name: Minimum heat pump temperature
        description: Lower bound of the temperature slider in the OpenPool UI.
      heater_temp_max:
        name: Maximum heat pump temperature
        description: Upper bound of the temperature slider in the OpenPool UI.
      pump_power_without_chlorinator_w:
        name: Pump power without chlorination
        description: Typical power in watts when only the pump is running.
      pump_power_with_chlorinator_w:
        name: Pump power with chlorination
        description: From this power in watts, OpenPool shows chlorination as active.
  profiles:
    name: Profiles
    description: Time windows for the automatic pump profiles.
    fields:
      pump_start:
        name: Pump start
      pump_end:
        name: Pump end
      bad_weather_start:
        name: Bad weather start
      bad_weather_end:
        name: Bad weather end
      night_swim_duration_hours:
        name: Night swimming duration in hours
        description: Maximum runtime of the night swimming profile in hours before OpenPool ends it automatically.
  restart_pulses:
    name: Chlorination restarts
    description: Short automatic power-offs so the Intex chlorination system starts again.
    fields:
      pulse_duration_s:
        name: Power-off time in seconds
        description: How long the pump stays off for each chlorination restart.
      pulse_1:
        name: Pulse 1
        fields:
          enabled:
            name: Enabled
          time:
            name: Time
      pulse_2:
        name: Pulse 2
        fields:
          enabled:
            name: Enabled
          time:
            name: Time
      pulse_3:
        name: Pulse 3
        fields:
          enabled:
            name: Enabled
          time:
            name: Time
      pulse_4:
        name: Pulse 4
        fields:
          enabled:
            name: Enabled
          time:
            name: Time
network:
  8099/tcp: OpenPool web interface
