configuration:
  log_level:
    name: Log level
    description: Controls how much detail OpenPool writes to the add-on log.
  poll_interval_s:
    name: Update interval
    description: Time in seconds between Home Assistant value updates.
  connection:
    name: Home Assistant connection
    description: Connection to your Home Assistant instance. The automatic Supervisor connection is normally enough.
    fields:
      auth_mode:
        name: Authentication
        description: Use the automatic add-on connection or enter your own Home Assistant access.
      homeassistant_url:
        name: Home Assistant URL
        description: Internal address of your Home Assistant instance.
      access_token:
        name: Access token
        description: Only needed when the automatic add-on connection is not used.
  features:
    name: Features
    description: Turn optional OpenPool control areas on or off.
    fields:
      heat_pump_control:
        name: Heat pump control
        description: Allows OpenPool to control and monitor the heat pump, including PV release and pump run-on.
      weather_control:
        name: Weather control
        description: Uses the daily forecast for a recommendation or automatic pump profile selection.
  entities:
    name: Home Assistant devices and sensors
    description: Home Assistant devices and sensors OpenPool should use.
    fields:
      control:
        name: Controlled devices
        fields:
          pump_switch:
            name: Pump and chlorinator switch
          heater_climate:
            name: Heat pump
          heater_operation_mode:
            name: Heat pump operating mode
            description: Home Assistant selection list from which OpenPool reads the available heat pump start modes.
          weather:
            name: Weather service
      energy:
        name: PV and grid
        fields:
          use_combined_grid_sensor:
            name: One shared grid sensor
            description: Enable this when one sensor reports both grid import and export as positive or negative values.
          grid_power_import_positive:
            name: Positive value means grid import
            description: On means a positive value is grid import. Off means a positive value is grid export.
          grid_power:
            name: Shared import/export sensor
          pv_generation:
            name: PV production
          pv_export:
            name: Grid export
          grid_import:
            name: Grid import
      pump:
        name: Pump readings
        fields:
          pump_power:
            name: Pump power
          pump_current:
            name: Pump current
          pump_voltage:
            name: Pump voltage
          pump_signal:
            name: Pump signal
      heater:
        name: Heat pump readings
        fields:
          heater_power:
            name: Heat pump power
          heater_current:
            name: Heat pump current
          heater_voltage:
            name: Heat pump voltage
          heater_fan:
            name: Heat pump fan speed
          heater_ambient:
            name: Ambient air at the heat pump
          heater_water_in:
            name: Water temperature inlet
          heater_water_out:
            name: Water temperature outlet
  thresholds:
    name: Thresholds
    description: Values that decide when OpenPool may start or stop the heat pump.
    fields:
      pv_start_export_w:
        name: Start heat pump above
        description: Available PV power in watts required before the heat pump may start.
      pv_stop_export_w:
        name: Stop heat pump below
        description: If available PV power drops below this value, OpenPool stops the heat pump after the stability time.
      pv_start_stable_minutes:
        name: PV power stable before start
        description: Minutes with enough PV power before OpenPool may start the heat pump.
      pv_stop_stable_minutes:
        name: PV power too low before stop
        description: Minutes with too little PV power before OpenPool stops the heat pump.
      heater_temp_min:
        name: Minimum heat pump temperature
        description: Lower bound of the temperature slider in the OpenPool UI.
      heater_temp_max:
        name: Maximum heat pump temperature
        description: Upper bound of the temperature slider in the OpenPool UI.
      pump_power_without_chlorinator_w:
        name: Pump power without chlorination
        description: Typical power in watts when only the pump is running.
      pump_power_with_chlorinator_w:
        name: Pump power with chlorination
        description: From this power in watts, OpenPool shows chlorination as active.
  profiles:
    name: Profiles
    description: Time windows for the automatic pump profiles.
    fields:
      pump_start:
        name: Pump start
      pump_end:
        name: Pump end
      bad_weather_start:
        name: Bad weather start
      bad_weather_end:
        name: Bad weather end
      night_swim_duration_hours:
        name: Night swimming duration in hours
        description: Maximum runtime of the night swimming profile in hours before OpenPool ends it automatically.
  restart_pulses:
    name: Chlorination restarts
    description: Short automatic power-offs so the Intex chlorination system starts again.
    fields:
      pulse_duration_s:
        name: Power-off time in seconds
        description: How long the pump stays off for each chlorination restart.
      pulse_1:
        name: Pulse 1
        fields:
          enabled:
            name: Enabled
          time:
            name: Time
      pulse_2:
        name: Pulse 2
        fields:
          enabled:
            name: Enabled
          time:
            name: Time
      pulse_3:
        name: Pulse 3
        fields:
          enabled:
            name: Enabled
          time:
            name: Time
      pulse_4:
        name: Pulse 4
        fields:
          enabled:
            name: Enabled
          time:
            name: Time
network:
  8099/tcp: OpenPool web interface
