configuration:
  log_level:
    name: Log-Level
    description: Detailgrad der OpenPool Add-on Logs.
  poll_interval_s:
    name: Aktualisierungsrate
    description: Sekunden zwischen Home Assistant Abfragen und UI Live-Updates.
  connection:
    name: Home Assistant Verbindung
    description: Fallback-Zugang für Systeme ohne Supervisor-Token.
    fields:
      homeassistant_url:
        name: Home Assistant URL
        description: Interne URL der Home Assistant Instanz.
      access_token:
        name: Long-Lived Access Token
        description: Optionaler Fallback-Token für die Home Assistant REST API.
  entities:
    name: Home Assistant Entitäten
    description: Entitäten, die OpenPool für Anzeige und Steuerung verwendet.
    fields:
      pump_switch:
        name: Pumpe / Chlorsystem Schalter
      heater_climate:
        name: Wärmepumpe Climate
      weather:
        name: Wetter Entity
      pv_generation:
        name: PV Erzeugung Sensor
      pv_export:
        name: Netzeinspeisung Sensor
      grid_import:
        name: Netzbezug Sensor
      house_consumption:
        name: Nettobezug Sensor
      pump_power:
        name: Pumpe Leistung Sensor
      pump_current:
        name: Pumpe Strom Sensor
      pump_voltage:
        name: Pumpe Spannung Sensor
      pump_signal:
        name: Pumpe Signal Sensor
      heater_power:
        name: Heizung Leistung Sensor
      heater_current:
        name: Heizung Netzstrom Sensor
      heater_voltage:
        name: Heizung Netzspannung Sensor
      heater_fan:
        name: Heizung Lüfter Sensor
      heater_ambient:
        name: Heizung Umgebungsluft Sensor
      heater_water_in:
        name: Heizung Wasser Eingang Sensor
      heater_water_out:
        name: Heizung Wasser Ausgang Sensor
  thresholds:
    name: Grenzwerte
    description: Grenzwerte für PV-Freigabe, Stabilzeiten und Temperaturbereich.
    fields:
      pv_start_export_w:
        name: PV Startfreigabe in Watt
        description: Verfügbare PV-Leistung, die mindestens erreicht werden muss, bevor die Wärmepumpe starten darf.
      pv_stop_export_w:
        name: PV Stoppfreigabe in Watt
        description: Verfügbare PV-Leistung, unter der die Wärmepumpe wieder ausgeschaltet wird.
      pv_start_stable_minutes:
        name: PV Start stabil Minuten
        description: Minuten, die die Startfreigabe durchgehend erfüllt sein muss.
      pv_stop_stable_minutes:
        name: PV Stopp stabil Minuten
        description: Minuten, die die Stoppgrenze durchgehend unterschritten sein muss.
      heater_temp_min:
        name: Minimale Heizungstemperatur
      heater_temp_max:
        name: Maximale Heizungstemperatur
  profiles:
    name: Profile
    description: Zeitfenster für die OpenPool Steuerlogik.
    fields:
      pump_start:
        name: Pumpenstart
      pump_end:
        name: Pumpenende
      bad_weather_start:
        name: Schlechtwetter Start
      bad_weather_end:
        name: Schlechtwetter Ende
      night_swim_max_minutes:
        name: Nachtbaden Max. Dauer Minuten
  restart_pulses:
    name: Restart-Pulse
    description: Automatische kurze Ausschaltimpulse für das Chlorsystem.
    fields:
      pulse_1:
        name: Pulse 1
      pulse_2:
        name: Pulse 2
      pulse_3:
        name: Pulse 3
      pulse_4:
        name: Pulse 4
network:
  8099/tcp: OpenPool Weboberfläche
