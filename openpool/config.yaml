name: OpenPool
version: "1.2.5"
slug: openpool
description: OpenSource Pool System Controller currently designed for Intex 26680 based pump/chlorinator systems, heat pumps and PV surplus control.
url: https://github.com/cococheaf/ha-openpool
arch:
  - armhf
  - aarch64
  - amd64
  - i386
  - armv7
startup: application
boot: auto
init: false
backup: cold
backup_exclude:
  - "*.tmp"
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:pool
panel_title: OpenPool
panel_admin: false
webui: http://[HOST]:[PORT:8099]/
homeassistant_api: true
hassio_api: true
hassio_role: default
ports:
  8099/tcp: null
ports_description:
  8099/tcp: OpenPool web interface
watchdog: http://[HOST]:[PORT:8099]/healthz
map:
  - type: addon_config
    read_only: false
options:
  log_level: info
  poll_interval_s: 1
  connection:
    auth_mode: supervisor
    homeassistant_url: http://homeassistant:8123
    access_token: ""
  features:
    heat_pump_control: true
    weather_control: true
  devices:
    pump_and_chlorinator_switch: switch.poolpumpe
    heat_pump: climate.poolheizung
    heat_pump_operating_mode: select.poolheizung_betriebsmodus
    weather_service: weather.home
  energy:
    one_grid_sensor_for_import_and_export: false
    positive_grid_value_is_import: true
    shared_grid_power_sensor: sensor.netzleistung
    pv_production_sensor: sensor.pv_erzeugungsleistung
    grid_export_sensor: sensor.stromzahler_active_power_minus
    grid_import_sensor: sensor.stromzahler_active_power_plus
    one_battery_sensor_for_charge_and_discharge: false
    positive_battery_value_is_charge: true
    shared_battery_power_sensor: ""
    battery_charge_sensor: ""
    battery_discharge_sensor: ""
    prefer_battery_charging: false
  pump_readings:
    pump_power_sensor: sensor.poolpumpe_leistung
    pump_current_sensor: sensor.poolpumpe_current
    pump_voltage_sensor: sensor.poolpumpe_spannung
    pump_signal_sensor: sensor.poolpumpe_signal
  heat_pump_readings:
    heat_pump_power_sensor: sensor.poolheizung_leistung
    heat_pump_current_sensor: sensor.poolheizung_netzstrom
    heat_pump_voltage_sensor: sensor.poolheizung_netzspannung
    heat_pump_fan_sensor: sensor.poolheizung_lufter
    heat_pump_ambient_air_sensor: sensor.poolheizung_umgebungsluft_temperatur
    heat_pump_water_in_sensor: sensor.poolheizung_wassertemperatur_eingang
    heat_pump_water_out_sensor: sensor.poolheizung_wassertemperatur_ausgang
  thresholds:
    pv_start_export_w: 1500
    pv_stop_export_w: 1500
    pv_start_stable_minutes: 5
    pv_stop_stable_minutes: 1
    heater_temp_min: 18
    heater_temp_max: 32
    pump_power_without_chlorinator_w: 450
    pump_power_with_chlorinator_w: 500
  profiles:
    pump_start: "07:30"
    pump_end: "22:00"
    bad_weather_start: "13:00"
    bad_weather_end: "16:15"
    night_swim_duration_hours: 10
  restart_pulses:
    pulse_duration_s: 3
    pulse_1:
      enabled: true
      time: "11:59"
    pulse_2:
      enabled: true
      time: "16:59"
    pulse_3:
      enabled: true
      time: "23:59"
    pulse_4:
      enabled: false
      time: "00:00"
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  poll_interval_s: int
  connection:
    auth_mode: list(supervisor|openpool_user_token)
    homeassistant_url: str
    access_token: password
  features:
    heat_pump_control: bool
    weather_control: bool
  devices:
    pump_and_chlorinator_switch: str
    heat_pump: str
    heat_pump_operating_mode: str
    weather_service: str
  energy:
    one_grid_sensor_for_import_and_export: bool
    positive_grid_value_is_import: bool
    shared_grid_power_sensor: str
    pv_production_sensor: str
    grid_export_sensor: str
    grid_import_sensor: str
    one_battery_sensor_for_charge_and_discharge: bool
    positive_battery_value_is_charge: bool
    shared_battery_power_sensor: str
    battery_charge_sensor: str
    battery_discharge_sensor: str
    prefer_battery_charging: bool
  pump_readings:
    pump_power_sensor: str
    pump_current_sensor: str
    pump_voltage_sensor: str
    pump_signal_sensor: str
  heat_pump_readings:
    heat_pump_power_sensor: str
    heat_pump_current_sensor: str
    heat_pump_voltage_sensor: str
    heat_pump_fan_sensor: str
    heat_pump_ambient_air_sensor: str
    heat_pump_water_in_sensor: str
    heat_pump_water_out_sensor: str
  thresholds:
    pv_start_export_w: int
    pv_stop_export_w: int
    pv_start_stable_minutes: float
    pv_stop_stable_minutes: float
    heater_temp_min: float
    heater_temp_max: float
    pump_power_without_chlorinator_w: int
    pump_power_with_chlorinator_w: int
  profiles:
    pump_start: str
    pump_end: str
    bad_weather_start: str
    bad_weather_end: str
    night_swim_duration_hours: float
  restart_pulses:
    pulse_duration_s: int
    pulse_1:
      enabled: bool
      time: str
    pulse_2:
      enabled: bool
      time: str
    pulse_3:
      enabled: bool
      time: str
    pulse_4:
      enabled: bool
      time: str
